name: Rebuild audio assets

# The music loops and sound effects are synthesized by a script; when it changes,
# regenerate them and commit the WAVs so renders never need to build audio.

on:
  push:
    paths: ["scripts/build-audio-assets.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-audio-assets.mjs
      - run: |
          git config user.name "dreamy-discoveries[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add public/music public/sfx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: rebuild music + sfx [skip ci]"
          git push
