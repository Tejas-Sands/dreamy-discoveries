name: Scheduled video

# Every day: take the next moral-story topic from library/queue.yml, or let
# autopilot choose a curated moral/problem seed for one LLM script call.

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamy-daily-video
  cancel-in-progress: false
  queue: max

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      empty: ${{ steps.pick.outputs.empty }}
      id: ${{ steps.pick.outputs.id }}
      slug: ${{ steps.pick.outputs.slug }}
      topic: ${{ steps.pick.outputs.topic }}
      template: ${{ steps.pick.outputs.template }}
      type: ${{ steps.pick.outputs.type }}
      hero: ${{ steps.pick.outputs.hero }}
      minutes: ${{ steps.pick.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Next from the queue, or autopilot
        id: pick
        run: |
          node scripts/queue.mjs pop --stories-only
          if grep -q '^empty=true' "$GITHUB_OUTPUT"; then
            sed -i '/^empty=true/d' "$GITHUB_OUTPUT"
            node scripts/autopilot.mjs
          fi
      - name: Commit queue state
        run: |
          git config user.name "dreamy-discoveries[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add library
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "queue: start ${{ steps.pick.outputs.id }} [skip ci]"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then pushed=true; break; fi
            sleep $((i * 5))
          done
          [ "$pushed" = "true" ]

  make:
    needs: pick
    if: needs.pick.outputs.empty != 'true'
    uses: ./.github/workflows/make-video.yml
    secrets: inherit
    with:
      topic: ${{ needs.pick.outputs.topic }}
      template: ${{ needs.pick.outputs.template }}
      type: ${{ needs.pick.outputs.type }}
      hero: ${{ needs.pick.outputs.hero }}
      minutes: ${{ needs.pick.outputs.minutes }}
      queue_id: ${{ needs.pick.outputs.id }}
      slug: ${{ needs.pick.outputs.slug }}

  recover:
    needs: [pick, make]
    if: always() && needs.pick.result == 'success' && (needs.make.result == 'failure' || needs.make.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dreamy-calendar-state
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve the queued topic and any committed script for retry
        env:
          QUEUE_ID: ${{ needs.pick.outputs.id }}
          SAVED_SLUG: ${{ needs.make.outputs.slug }}
        run: |
          node scripts/queue.mjs retry "$QUEUE_ID" --slug "$SAVED_SLUG"
          git config user.name "dreamy-discoveries[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add library/queue.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "queue: retry $QUEUE_ID [skip ci]"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then pushed=true; break; fi
            sleep $((i * 5))
          done
          [ "$pushed" = "true" ]
