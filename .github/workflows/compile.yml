name: Compilation video

# Stitch finished episodes into a long "best of" video: zero AI, zero re-rendering.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated episode slugs (blank = automatic: the last N of a type)"
        required: false
        type: string
      type:
        description: "For automatic selection"
        required: false
        default: any
        type: choice
        options: [any, rhyme, story]
      count:
        description: "How many episodes (automatic selection)"
        required: false
        default: "6"
        type: string
      title:
        description: "Title (blank = generated)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
      - name: Cache Chrome Headless Shell + bundler cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.remotion
            node_modules/.cache/webpack
          key: remotion-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            remotion-${{ hashFiles('package-lock.json') }}-
      - run: npx remotion browser ensure
      - name: Compile
        id: compile
        env:
          GH_TOKEN: ${{ github.token }}
          IN_SLUGS: ${{ inputs.slugs }}
          IN_TYPE: ${{ inputs.type }}
          IN_COUNT: ${{ inputs.count }}
          IN_TITLE: ${{ inputs.title }}
        run: |
          ARGS=()
          if [ -n "$IN_SLUGS" ]; then ARGS+=(--slugs "$IN_SLUGS"); else ARGS+=(--auto "${IN_TYPE:-any}" --count "${IN_COUNT:-6}"); fi
          [ -n "$IN_TITLE" ] && ARGS+=(--title "$IN_TITLE")
          node scripts/compile.mjs "${ARGS[@]}"
      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.compile.outputs.name }}
        run: node scripts/publish-release.mjs --slug "$NAME" --tag "$NAME" --files "out/episodes/$NAME.mp4,out/episodes/$NAME.png,out/episodes/$NAME.metadata.txt,out/episodes/$NAME.json" --title "${{ steps.compile.outputs.title }}"
      - name: Tell Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          NAME: ${{ steps.compile.outputs.name }}
        run: node scripts/send-telegram.mjs --slug "$NAME" --link-only
      - name: Record in the catalog
        env:
          NAME: ${{ steps.compile.outputs.name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          node -e '
            import("./scripts/lib/catalog.mjs").then(({ readCatalog, writeCatalog }) => {
              const fs = require("node:fs");
              const info = JSON.parse(fs.readFileSync(`out/episodes/${process.env.NAME}.json`, "utf8"));
              const c = readCatalog();
              c.compilations.push({ ...info, release: process.env.RELEASE_URL || null, renderedAt: new Date().toISOString() });
              writeCatalog(c);
            })'
          git config user.name "dreamy-discoveries[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add library
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "catalog: compilation $NAME [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep $((i * 5)); done
